name: Handbook

on:
  push:
    branches: [main]
    paths:
      - 'doc/handbook/**'
      - 'docs/handbook-web.md'
      - 'tools/check-handbook-html.py'
      - '.github/workflows/handbook.yml'
  pull_request:
    paths:
      - 'doc/handbook/**'
      - 'docs/handbook-web.md'
      - 'tools/check-handbook-html.py'
      - '.github/workflows/handbook.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned mdBook
        env:
          MDBOOK_VERSION: '0.5.4'
          MDBOOK_SHA256: '3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/mdbook-bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"
      - name: Build and check handbook
        run: |
          mdbook build doc/handbook
          python3 tools/check-handbook-html.py build/handbook
      - uses: actions/upload-artifact@v4
        with:
          name: mojt-handbook-html
          path: build/handbook/
          if-no-files-found: error
